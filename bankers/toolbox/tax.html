<html lang="ja">
<head>

<style>
/* ツールページ共通(bizplanlabo規約: 入力確定時再計算・？チップ・カンマ区切り・単位小さく) */
.tool-grid { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
@media (min-width: 900px) { .tool-grid { grid-template-columns: 1.15fr 1fr; } }
.tool-card { background: #fff; border: 1px solid var(--line); border-radius: .75rem; overflow: hidden; }
.tool-card .tc-head {
  display: flex; align-items: center; padding: 10px 16px;
  background: var(--color-navy); color: #fff;
  font-size: var(--fs-3); font-weight: 700; letter-spacing: .08em;
}
.tool-card .tc-body { padding: 16px 18px 18px; }
.fld { margin-bottom: 13px; }
.fld label { display: block; font-size: var(--fs-2); font-weight: 700; color: var(--color-slate); margin-bottom: 5px; letter-spacing: .04em; }
.fld .row { display: flex; align-items: center; gap: 8px; }
.fld input[type="text"] {
  width: 100%; font-family: Arial, sans-serif; font-size: var(--fs-4); font-weight: 700;
  text-align: right; padding: 8px 11px; color: #2b2f36;
  border: 1.5px solid var(--color-gray-200); border-radius: .5rem; background: #fff;
}
.fld input[type="text"]:focus { outline: none; border-color: var(--color-navy); box-shadow: 0 0 0 3px rgba(15,42,74,.10); }
.fld input.miss { border-color: #d9a0a0; background: #fdf1f1; }
.fld input::placeholder { color: #adb5bf; font-weight: 400; font-family: "BIZ UDPGothic", sans-serif; }
.fld .unit-l { flex: 0 0 auto; font-size: var(--fs-2); color: var(--color-slate); }
.fld select {
  width: 100%; font-family: inherit; font-size: var(--fs-3); font-weight: 700; color: var(--color-navy);
  padding: 8px 11px; border: 1.5px solid var(--color-gray-200); border-radius: .5rem; background: #fff; cursor: pointer;
}
.fld select:focus { outline: none; border-color: var(--color-navy); box-shadow: 0 0 0 3px rgba(15,42,74,.10); }
.res-note { font-size: var(--fs-2); font-weight: 700; color: #a83d3d; padding: 4px 0 10px; }
.res-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 2px; border-bottom: 1px dotted var(--line); }
.res-row:last-child { border-bottom: none; }
.res-row .l { font-size: var(--fs-3); color: var(--color-slate); }
.res-row .v { font-size: var(--fs-5); }
.res-row.big .v { font-size: var(--fs-6); color: var(--color-navy); }
.res-row .v .num { letter-spacing: .01em; }
.tool-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.btn-clear {
  font-size: var(--fs-2); font-weight: 700; padding: 8px 16px; border-radius: .5rem; cursor: pointer;
  background: #fff; color: var(--color-navy); border: 1px solid var(--color-navy);
}
.btn-clear:hover { background: var(--color-navy); color: #fff; }
.tool-back { font-size: var(--fs-2); font-weight: 700; color: var(--color-slate); text-decoration: none; }
.tool-back:hover { color: var(--color-navy); text-decoration: underline; }
</style>
</head>
<body class="bg-[#f8f9fb] text-[#2b2f36]">

<!-- ===== グローバルヘッダー ===== -->
<header id="site-header" class="sticky top-0 z-50 bg-white border-b border-gray-100">
  <div class="max-w-[1400px] mx-auto px-5 sm:px-8">
    <div class="flex items-center justify-between gap-5 min-h-[78px] py-2.5 flex-wrap">
      <a href="index.html" class="flex items-center shrink-0 no-underline">
        <img src="../images/logo-toolbox.png?v=101" alt="銀行員の道具箱 — Bankers Toolbox" class="h-[46px] sm:h-[54px] w-auto" />
      </a>
      <nav class="flex items-center gap-4 sm:gap-5" aria-label="シリーズ内リンク">
        <a href="../weekend/" class="opacity-70 hover:opacity-100 transition-opacity" title="銀行員の休日"><img src="../images/logo.png?v=103" alt="銀行員の休日" class="h-[26px] w-auto" /></a>
        <a href="../weekday/" class="opacity-70 hover:opacity-100 transition-opacity" title="銀行員の平日"><img src="../images/logo-weekday.png?v=101" alt="銀行員の平日" class="h-[26px] w-auto" /></a>
      </nav>
    </div>
  </div>
</header>

<!-- ===== ヒーロー(若葉グラデーション) ===== -->
<section class="hero-pattern hero-pattern--toolbox relative overflow-hidden h-[86px] sm:h-[104px]">
  <span class="hero-brand-mark hero-brand-mark--tl" aria-hidden="true">TOOL.3</span>
  <span class="hero-brand-mark hero-brand-mark--br" aria-hidden="true">TAX</span>
  <div class="relative z-10 max-w-[1100px] mx-auto px-5 sm:px-8 h-full flex items-center">
    <h1 class="text-white text-[16px] sm:text-[20px] font-bold tracking-[.12em] pl-3.5 border-l-[3px] border-[#a8d8a8]">
      税金計算
    </h1>
  </div>
</section>

<main class="max-w-[1100px] mx-auto px-5 sm:px-8 py-8 sm:py-10">

  <div class="mb-5 flex items-center justify-between gap-4 flex-wrap">
    <div>
      <span class="text-5xl font-black leading-none tracking-tight" style="color:#2e6b2e">Tool.<span style="color:#0f2a4a">3</span></span>
      <div class="w-8 h-[3px] mt-3 rounded-full" style="background-color:#a53b3b"></div>
    </div>
    <a href="index.html" class="tool-back">&larr; 道具箱トップへ戻る</a>
  </div>

  <div class="tool-grid">

    <div class="tool-card">
      <div class="tc-head">入力</div>
      <div class="tc-body">
        <div class="fld">
          <label for="inc">課税所得金額<button type="button" class="help-tip" aria-label="解説">?<span class="tip-body">収入から給与所得控除・社会保険料控除・基礎控除などの各種控除を差し引いた後の金額です。源泉徴収票の「給与所得控除後の金額」から所得控除の合計額を引いた金額が目安になります。</span></button></label>
          <div class="row"><input type="text" id="inc" inputmode="decimal" placeholder="入力例：5,000,000" /><span class="unit-l">円</span></div>
        </div>

        <div class="tool-actions">
          <button type="button" id="btn-clear" class="btn-clear">入力データクリア</button>
        </div>
      </div>
    </div>

    <div class="tool-card">
      <div class="tc-head">計算結果</div>
      <div class="tc-body">
        <div id="res-note" class="res-note" hidden></div>
        <div class="res-row big"><span class="l">所得税(速算表)</span><span class="v" id="r1">&mdash;</span></div>
        <div class="res-row"><span class="l">復興特別所得税(2.1%)</span><span class="v" id="r2">&mdash;</span></div>
        <div class="res-row"><span class="l">住民税(所得割 約10%)</span><span class="v" id="r3">&mdash;</span></div>
        <div class="res-row"><span class="l">税額合計</span><span class="v" id="r4">&mdash;</span></div>
        <div class="res-row"><span class="l">実効税率</span><span class="v" id="r5">&mdash;</span></div>

      </div>
    </div>

  </div>

  <p class="text-[11px] text-gray-400 mt-6 leading-relaxed">本ツールはサンプル版の概算計算です。実際の取引・申告・契約にあたっては、正式な条件・税率・料率をご確認ください。</p>

</main>

<footer class="border-t border-gray-200 mt-4">
  <div class="max-w-[1400px] mx-auto px-5 sm:px-8 py-6 text-center">
    <p class="text-[12px] text-gray-400 tracking-[.08em]"><a href="../" class="hover:text-[#0f2a4a]">銀行員シリーズ</a>&nbsp;&nbsp;&copy; 2026 Bankers Toolbox</p>
  </div>
</footer>

<script>
/* 共通ヘルパー(bizplanlabo規約: 確定時再計算・カンマ整形・あと◯項目) */
function num(el) { var v = String(el.value).replace(/[,\s円%年ヶ月]/g, ''); return v === '' ? null : Number(v); }
function fmt(n, d) { d = d || 0; return Number(n).toLocaleString('ja-JP', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function setV(id, html) { document.getElementById(id).innerHTML = html; }
function yen(n) { return '<span class="num">' + fmt(Math.round(n)) + '</span><span class="unit">円</span>'; }
function pct(n, d) { return '<span class="num">' + fmt(n, d === undefined ? 2 : d) + '</span><span class="unit">%</span>'; }
function commaField(el) {
  var n = num(el);
  if (n === null || isNaN(n)) return;
  var d = (String(el.value).indexOf('.') >= 0 && el.dataset.dec === '1') ? Math.min(String(el.value).split('.')[1].replace(/[^0-9]/g,'').length, 3) : 0;
  el.value = fmt(n, d);
}
// 「？」チップはTabで止まらない(全体ルール)
Array.prototype.forEach.call(document.querySelectorAll('.help-tip'), function (t) { t.setAttribute('tabindex', '-1'); });

var REQ = ['inc'];
function recalc() {
  var missing = 0;
  REQ.forEach(function (id) {
    var el = document.getElementById(id);
    var v = num(el);
    if (v === null || isNaN(v)) { el.classList.add('miss'); missing++; }
    else el.classList.remove('miss');
  });
  var note = document.getElementById('res-note');
  if (missing > 0) {
    note.hidden = false;
    note.textContent = 'あと' + missing + '項目入力してください';
    clearResults();
    return;
  }
  note.hidden = true;
  compute();
}
document.addEventListener('change', function (e) {
  if (e.target.matches('input[type="text"]')) commaField(e.target);
  if (e.target.matches('input, select')) recalc();
});
document.getElementById('btn-clear').addEventListener('click', function () {
  Array.prototype.forEach.call(document.querySelectorAll('input[type="text"]'), function (i) { i.value = ''; i.classList.remove('miss'); });
  Array.prototype.forEach.call(document.querySelectorAll('select'), function (s) { s.selectedIndex = 0; });
  document.getElementById('res-note').hidden = true;
  clearResults();
});

var BRACKETS = [
  [1949000, 0.05, 0], [3299000, 0.10, 97500], [6949000, 0.20, 427500],
  [8999000, 0.23, 636000], [17999000, 0.33, 1536000], [39999000, 0.40, 2796000], [Infinity, 0.45, 4796000]
];
function compute() {
  var inc = num(document.getElementById('inc'));
  var it = 0;
  for (var i = 0; i < BRACKETS.length; i++) {
    if (inc <= BRACKETS[i][0]) { it = inc * BRACKETS[i][1] - BRACKETS[i][2]; break; }
  }
  it = Math.max(0, it);
  var rec = it * 0.021;
  var res_ = inc * 0.10;
  var total = it + rec + res_;
  setV('r1', yen(it));
  setV('r2', yen(rec));
  setV('r3', yen(res_));
  setV('r4', yen(total));
  setV('r5', pct(inc > 0 ? total / inc * 100 : 0, 2));
}
function clearResults() { ['r1','r2','r3','r4','r5'].forEach(function (i) { setV(i, '&mdash;'); }); }
clearResults();
</script>

</body>
</html>
